name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Hoshidicts is C++23 and uses std::ranges::to, which needs GCC 14; Ubuntu 24.04
      # defaults to GCC 13 but has 14 preinstalled.
      - name: GCC 14 (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: clippy (library only)
        run: cargo clippy --lib --no-default-features -- -D warnings
      # Includes upstream's Node suites through tests/conformance.rs.
      - name: test
        run: cargo test --all-features
      - name: 128 MiB stress
        run: cargo test --release --test limits -- --ignored

  # The oracle suites run the same requests through Hachidori's own code and the
  # relay and require the same answers. HACHIDORI_COMMIT is the version host mode
  # follows (docs/host-mode.md, "Compatible Hachidori").
  oracles:
    name: oracles
    runs-on: ubuntu-latest
    env:
      HACHIDORI_COMMIT: d41c37abe4ea54ef6ec885e9517bbf5655f3d718
      HACHIDORI_ORACLES: required
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: bee-san/hachidori
          ref: ${{ env.HACHIDORI_COMMIT }}
          path: .hachidori
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GCC 14
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Hachidori test tooling and fixtures
        working-directory: .hachidori
        run: |
          npm ci --prefix test/tooling --ignore-scripts
          node test/make-fixture.mjs
      - run: cargo build --features host
      - name: oracle suites
        env:
          HACHIDORI_SOURCE: ${{ github.workspace }}/.hachidori
        run: >-
          node --test
          tests/conformance/host-oracle.test.mjs tests/conformance/import-oracle.test.mjs
          tests/conformance/mutations-oracle.test.mjs tests/conformance/settings-oracle.test.mjs
          tests/conformance/anki-oracle.test.mjs tests/conformance/anki-index.test.mjs
          tests/conformance/anki-index-languages.test.mjs
          tests/conformance/profiles-oracle.test.mjs tests/conformance/sharing-oracle.test.mjs

  msrv:
    name: MSRV (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      # Hoshidicts is C++23 and uses std::ranges::to, which needs GCC 14; Ubuntu 24.04
      # defaults to GCC 13 but has 14 preinstalled.
      - name: GCC 14 (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - run: cargo check --all-targets --all-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
