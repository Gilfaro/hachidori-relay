name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: host
            binary: hachidori-relay.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: host
            binary: hachidori-relay
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            # No host mode: musl-tools has no C++ compiler for Hoshidicts (C++23).
            binary: hachidori-relay
          - os: macos-latest
            target: aarch64-apple-darwin
            features: host
            binary: hachidori-relay
          - os: macos-latest
            target: x86_64-apple-darwin
            features: host
            binary: hachidori-relay
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Hoshidicts is C++23 and uses std::ranges::to, which needs GCC 14; Ubuntu 24.04
      # defaults to GCC 13 but has 14 preinstalled.
      - name: GCC 14 (Linux)
        if: endsWith(matrix.target, 'linux-gnu')
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: musl tools
        if: endsWith(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} --features "${{ matrix.features }}"
      - name: package
        shell: bash
        run: |
          name="hachidori-relay-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" README.md LICENSE "$name/"
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
